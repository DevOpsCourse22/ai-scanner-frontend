# The React app's static files. Served on 8080 by the unprivileged nginx
# image (uid 101), which cannot bind ports below 1024.
#
# There is no proxy here: in Kubernetes the Ingress sends /auth, /reviews,
# /providers, /webhook and /health to the gateway, and everything else here.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Liveness/readiness for Kubernetes, answered by nginx itself.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets never change under the same name: cache them long.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else is the single-page app. index.html is never cached, so
    # a new deployment is picked up on the next page load.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
